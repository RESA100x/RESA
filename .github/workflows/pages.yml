name: Pages

# Publishes the static site in `website/` to GitHub Pages.
#
# The site is served at https://<owner>.github.io/<repo>/ — the same URL as
# `officialDomain` in website/config.json. `enablement: true` below turns Pages
# on (source: GitHub Actions) the first time this runs, so a fresh fork or a
# repository that never had the setting flipped does not fail here; it is a
# no-op once Pages exists.
#
# The site build reads repository files only (it needs Node 22+ for
# `stripTypeScriptTypes`), so no dependencies have to be installed.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'public/**'
      - 'src/components/icon-data.ts'
      - 'design.md'
      - 'resa.config.json'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push replace a deploy that is still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build the static site
        run: node website/scripts/build.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
