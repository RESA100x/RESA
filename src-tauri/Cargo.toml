[package]
name = "nowly"
version = "0.2.32"
description = "Desktop wallpaper calendar"
authors = ["RESA"]
edition = "2021"

[lib]
# Tauri mobile builds link the app as a library; the desktop binary in
# `src/main.rs` is a one-line wrapper around `nowly_lib::run()`.
name = "nowly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
rrule = "0.14"
iana-time-zone = "0.1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
# The document vault seals every file with AES-256-GCM under a key derived
# from the user PIN, so a copied database or folder yields nothing.
aes-gcm = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rig-core = { version = "=0.42.0", default-features = false, features = ["reqwest", "rustls"] }
bytes = "1"
tokio = { version = "1", features = ["time"] }
reqwest-rig = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls"] }
tauri-plugin-dialog = "2"
# Backups are one portable file; the database and attachments are already
# compressed, so a plain deflate zip keeps the archive small without pulling in
# another compression stack.
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# The capture overlays fetch their frozen frame over a custom URI scheme, and
# `convertFileSrc` percent-encodes the whole path. Decoding it the same way
# Tauri's own protocols do keeps the separator from arriving as `%2F`.
percent-encoding = "=2.3.2"

# Android has no desktop reminder surfaces, so the phone build posts the
# calendar reminders through the native notification channel instead.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-notification = "2"
# Calendar reminders are armed with AlarmManager so they still ring after
# Android kills the process; the call crosses into Kotlin through JNI.
jni = "0.21"

# Desktop-only stack. The Android build has no tray, no global shortcuts, no
# Win32 surface capture and no native audio playback, so none of this is
# compiled there.
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-global-shortcut = "2.3.2"
rodio = { version = "0.21", default-features = false, features = ["playback", "wav"] }

# Keep the pixel matching loops usable at display frame rates in the dev app.
[profile.dev.package.nowly]
opt-level = 2

[dev-dependencies]
# mock runtime，用于在单元测试里真实走一遍 #[tauri::command] 的 IPC 参数解析。
tauri = { version = "=2.11.5", features = ["test"] }

[target.'cfg(windows)'.dependencies]
arboard = { version = "=3.6.1", default-features = false, features = ["image-data"] }
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_DataExchange",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "ApplicationModel",
  "Win32_Storage_Packaging_Appx"
] }
